name: Build EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create models directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "src\FaceProcessor\models" | Out-Null

      - name: Download ONNX model
        shell: pwsh
        run: |
          $modelPath = "assets\models\yolov8n-face.onnx"
          
          # 尝试多个下载源
          $urls = @(
            "https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8n-face.onnx",
            "https://huggingface.co/Ultralytics/YOLOv8/resolve/main/yolov8n-face.onnx"
          )
          
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              Invoke-WebRequest -Uri $url -OutFile $modelPath -UseBasicParsing -TimeoutSec 60
              $downloaded = $true
              Write-Host "Model downloaded successfully from: $url"
              break
            }
            catch {
              Write-Host "Failed: $url - $_"
            }
          }
          
          if (-not $downloaded) {
            Write-Host "::warning::Model download failed, using placeholder"
            # 创建一个简单的模型占位符 - 但这会导致人脸检测不工作
            # 用户需要手动下载模型
            "placeholder" | Out-File -FilePath $modelPath -Encoding utf8
          }
          
          # 验证文件大小（正常模型应该 > 5MB）
          if (Test-Path $modelPath) {
            $size = (Get-Item $modelPath).Length
            Write-Host "Model file size: $size bytes"
            if ($size -lt 1000000) {
              Write-Host "::warning::Model file is too small, may not be valid"
            }
          }
          
          # 复制到项目目录
          Copy-Item $modelPath "src\FaceProcessor\models\" -Force

      - name: Restore dependencies
        run: dotnet restore FaceProcessor.sln

      - name: Build and Publish
        run: |
          dotnet publish src/FaceProcessor/FaceProcessor.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

      - name: Ensure models in output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\models")) {
            New-Item -ItemType Directory -Force -Path "publish\models" | Out-Null
          }
          if (Test-Path "assets\models\yolov8n-face.onnx") {
            Copy-Item "assets\models\yolov8n-face.onnx" "publish\models\" -Force
          }

      - name: List output files
        shell: pwsh
        run: |
          Write-Host "Output files:"
          Get-ChildItem publish -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceProcessor-CS-EXE
          path: publish/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            publish/FaceProcessor.exe
            publish/models/yolov8n-face.onnx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
