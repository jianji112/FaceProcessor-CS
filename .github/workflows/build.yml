name: Build EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create models directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "src\FaceProcessor\models" | Out-Null

      - name: Download ONNX model
        shell: pwsh
        run: |
          $modelPath = "assets\models\yolov8n-face.onnx"
          $downloaded = $false
          
          # 使用可靠的模型源
          $urls = @(
            # UltraFace 模型 - 更小更可靠
            "https://github.com/onnx/models/raw/main/vision/body_analysis/ultraface/models/ultraface-320.onnx",
            # 备用：直接使用 OpenCV DNN 模块能识别的模型
            "https://raw.githubusercontent.com/opencv/opencv_3rdparty/dnn_samples_face_detector_20170830/res10_300x300_ssd_iter_140000_fp16.caffemodel"
          )
          
          Write-Host "尝试下载人脸检测模型..."
          
          # 先尝试下载一个可靠的人脸检测模型
          try {
            # 使用 OpenCV 内置的人脸检测模型（更可靠）
            $caffemodelUrl = "https://raw.githubusercontent.com/opencv/opencv_3rdparty/dnn_samples_face_detector_20170830/res10_300x300_ssd_iter_140000.caffemodel"
            $prototxtUrl = "https://raw.githubusercontent.com/opencv/opencv/master/samples/dnn/face_detector/deploy.prototxt"
            
            Invoke-WebRequest -Uri $caffemodelUrl -OutFile "assets\models\face_detector.caffemodel" -UseBasicParsing -TimeoutSec 120
            Invoke-WebRequest -Uri $prototxtUrl -OutFile "assets\models\deploy.prototxt" -UseBasicParsing -TimeoutSec 120
            
            $caffemodelSize = (Get-Item "assets\models\face_detector.caffemodel").Length
            Write-Host "Caffe model downloaded: $caffemodelSize bytes"
            
            if ($caffemodelSize -gt 1000000) {
              $downloaded = $true
              Write-Host "人脸检测模型下载成功"
            }
          }
          catch {
            Write-Host "Caffe model download failed: $_"
          }
          
          # 如果 Caffe 模型下载失败，尝试 ONNX
          if (-not $downloaded) {
            foreach ($url in $urls) {
              try {
                Write-Host "Trying: $url"
                Invoke-WebRequest -Uri $url -OutFile $modelPath -UseBasicParsing -TimeoutSec 120
                $downloaded = $true
                Write-Host "Model downloaded successfully"
                break
              }
              catch {
                Write-Host "Failed: $url - $_"
              }
            }
          }
          
          if (-not $downloaded) {
            Write-Host "::warning::所有模型下载失败，将使用占位符"
            "placeholder" | Out-File -FilePath $modelPath -Encoding utf8
          }
          
          # 验证文件大小
          if (Test-Path $modelPath) {
            $size = (Get-Item $modelPath).Length
            Write-Host "Model file size: $size bytes"
          }
          if (Test-Path "assets\models\face_detector.caffemodel") {
            $size = (Get-Item "assets\models\face_detector.caffemodel").Length
            Write-Host "Caffe model size: $size bytes"
          }
          
          # 复制到项目目录
          Copy-Item "assets\models\*" "src\FaceProcessor\models\" -Force -ErrorAction SilentlyContinue

      - name: Restore dependencies
        run: dotnet restore FaceProcessor.sln

      - name: Build and Publish
        run: |
          dotnet publish src/FaceProcessor/FaceProcessor.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

      - name: Ensure models in output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\models")) {
            New-Item -ItemType Directory -Force -Path "publish\models" | Out-Null
          }
          Copy-Item "assets\models\*" "publish\models\" -Force -ErrorAction SilentlyContinue
          
          Write-Host "Models in output:"
          Get-ChildItem "publish\models" -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: List output files
        shell: pwsh
        run: |
          Write-Host "Output files:"
          Get-ChildItem publish -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceProcessor-CS-EXE
          path: publish/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            publish/FaceProcessor.exe
            publish/models/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
