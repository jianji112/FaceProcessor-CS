name: Build EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download ONNX model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\models"
          New-Item -ItemType Directory -Force -Path "src\FaceProcessor\models"
          
          # 下载 YOLOv8-Face 模型
          $modelUrl = "https://huggingface.co/Nick3151/yolov8n-face/resolve/main/yolov8n-face.onnx"
          $modelPath = "assets\models\yolov8n-face.onnx"
          
          try {
            Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath -UseBasicParsing
            Write-Host "Model downloaded successfully"
          }
          catch {
            Write-Host "Model download failed: $_"
            # 创建占位符
            "placeholder" | Out-File -FilePath $modelPath
          }
          
          # 复制到项目目录
          if (Test-Path $modelPath) {
            Copy-Item $modelPath "src\FaceProcessor\models\" -Force
          }

      - name: Restore dependencies
        run: dotnet restore FaceProcessor.sln

      - name: Build and Publish
        run: |
          dotnet publish src/FaceProcessor/FaceProcessor.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

      - name: Ensure models in output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\models")) {
            New-Item -ItemType Directory -Force -Path "publish\models"
          }
          if (Test-Path "assets\models\yolov8n-face.onnx") {
            Copy-Item "assets\models\yolov8n-face.onnx" "publish\models\" -Force
          }

      - name: List output files
        shell: pwsh
        run: |
          Write-Host "Output files:"
          Get-ChildItem publish -Recurse | Select-Object FullName, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceProcessor-CS-EXE
          path: publish/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            publish/FaceProcessor.exe
            publish/models/yolov8n-face.onnx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
